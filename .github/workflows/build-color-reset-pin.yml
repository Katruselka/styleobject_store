name: Build Color Reset Pinterest cover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-color-reset-pin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render first page of original guide as permanent Pinterest JPG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils python3-pil
          pdftoppm -f 1 -singlefile -jpeg -r 125 color-guide.pdf /tmp/color-reset-cover
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          im=Image.open('/tmp/color-reset-cover.jpg').convert('RGB')
          out=Image.new('RGB',(1000,1500),'#f3eee6')
          im.thumbnail((845,1340),Image.Resampling.LANCZOS)
          out.paste(im,((1000-im.width)//2, 66))
          d=ImageDraw.Draw(out)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',24)
          msg='FREE GUIDE  ·  STYLEOBJECT'
          bbox=d.textbbox((0,0),msg,font=font)
          d.text(((1000-(bbox[2]-bbox[0]))//2,1450),msg,fill='#544b43',font=font)
          Path('images').mkdir(exist_ok=True)
          out.save('images/color-reset-pin.jpg',quality=90,optimize=True,subsampling=0)
          PY
      - name: Commit cover image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/color-reset-pin.jpg
          git commit -m 'Add original Color Reset cover for Pinterest' || exit 0
          git push
